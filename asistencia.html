<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX-Asistencia</title>
    <!-- Google Fonts Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Archivo CSS -->
    <link rel="stylesheet" href="assets/css/asistencia.css">
</head>
<body>
    <main class="asistencia-container">
        <!-- 1. Logo superior con cuadro blanco -->
        <div class="logo.png">
            <img src="assets/image/logo.png" alt="Logo">
        </div>

      
        <div class="user-profile">
            <div class="avatar-img-box">
                <img src="assets/image/image 5.png" alt="Avatar">
            </div>
            <h1>JAMES GOSLING</h1>
        </div>

        
        <div class="scanner-card">
            <div class="scanner-box">
                <div class="scan-frame">
                    <img src="assets/image/image 21.png" alt="Foto Escáner" class="scanner-photo">
                    <div class="corner top-left"></div>
                    <div class="corner top-right"></div>
                    <div class="corner bottom-left"></div>
                    <div class="corner bottom-right"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Archivo JS -->
    <script src="assets/js/asistencia.js"></script>
</body>
</html>
