<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Escritorio</title>

  <!-- Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/login-escritorio.css">
</head>
<body>

  <section>
    <img src="assets/image/image 12.png" alt="Equipo de trabajo">

    <form id="formLogin">
      <h1>Iniciar Sesión</h1>

      <label for="correo">Correo Electrónico:</label>
      <input type="email" id="correo" placeholder="ejemplo@email.com">

      <label for="clave">Contraseña:</label>
      <input type="password" id="clave" placeholder="Ingresar su contraseña">

      <button type="submit">INGRESAR</button>

      <p id="error"></p>
    </form>
  </section>

  <script src="assets/js/login-escritorio.js"></script>
</body>
</html>
