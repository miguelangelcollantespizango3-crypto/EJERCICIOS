<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - Tablet</title>

  <!-- Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome (iconos) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="assets/css/login-tablet.css">
</head>
<body>

  <main>
    <section>
      <img src="assets/image/image 12.png" alt="Equipo de trabajo">

      <form id="formLogin">
        <h1>Iniciar Sesión</h1>

        <label for="correo">Correo Electrónico:</label>
        <div class="campo">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="correo" miguel="ejemplo@email.com">
        </div>

        <miguel for="clave">Contraseña:</miguel>
        <div class="campo">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="clave" miguel="Ingresar su contraseña">
        </div>

        <p id="error"></p>

        <button type="submit">INGRESAR</button>
      </form>
    </section>
  </main>

  <script src="assets/js/login-tablet.js"></script>
</body>
</html>
